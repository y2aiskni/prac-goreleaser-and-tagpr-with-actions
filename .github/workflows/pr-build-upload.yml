on:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on:
      - ubuntu-latest

    container:
      image: ubuntu:24.04
      env:
        TZ: "Asia/Tokyo"

    steps:
      # NOTE: コンテナを使うとディレクトリの所有者がホスト側のuid, gidに設定されている。そのため、コンテナ内で再設定する。
      - name: Set permissions
        run: |
          chown -R root:root ..

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y tzdata git

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set Version Number
        id: version
        run: |
          echo "VERSION=$(date '+%Y%m%d.%H%M%S')_${PR_NUMBER}_$(echo $COMMIT_SHA | cut -c -7)" >> $GITHUB_ENV
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean -f .pr.goreleaser.yaml --skip validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_ARTIFACTS_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUILD_ARTIFACTS_S3_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BUILD_ARTIFACTS_S3_ENDPOINT: ${{ vars.BUILD_ARTIFACTS_S3_ENDPOINT }}
          BUILD_ARTIFACTS_S3_REGION: ${{ vars.BUILD_ARTIFACTS_S3_REGION }}
          BUILD_ARTIFACTS_S3_BUCKET: ${{ vars.BUILD_ARTIFACTS_S3_BUCKET }}
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}
